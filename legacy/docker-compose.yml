services:
  mattermost:
    image: mattermost/mattermost-team-edition:9.5
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=mysql
      - MM_SQLSETTINGS_DATASOURCE=root:MM_ROOT_PASSWORD@tcp(mattermost-mysql:3306)/mattermost?charset=utf8mb4,utf8&readTimeout=30s&writeTimeout=30s
      - MM_SQLSETTINGS_DATASOURCEREADREPLICAS=
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_ENABLELOCALMODE=true
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      - mattermost-mysql
    restart: unless-stopped

  mattermost-mysql:
    image: mysql:8.0
    container_name: mattermost-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=MM_ROOT_PASSWORD
      - MYSQL_DATABASE=mattermost
      - MYSQL_USER=mmuser
      - MYSQL_PASSWORD=MM_MMUSER_PASSWORD
      - TZ=UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    driver: bridge

volumes:
  mattermost_data:
  mattermost_logs:
  mysql_data:
